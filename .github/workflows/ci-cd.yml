name: Bankflow CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  # Job 1: Build, Test, and Containerize Microservices
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - payment-service
          - fraud-detection-service
          - notification-service
          - api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set lowercase repository name for Docker tag
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build with Maven
        run: |
          mvn clean package -DskipTests=true -pl common-dto,${{ matrix.service }} -am

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest

  # Job 2: Client Dashboard Build & Push
  build-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository name for Docker tag
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Dashboard Container
        uses: docker/build-push-action@v5
        with:
          context: ./bankflow-dashboard
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-dashboard:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-dashboard:latest

  # Job 3: Deploy to Kubernetes on Merge to Main
  deploy-k8s:
    needs: [build-and-test, build-dashboard]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Validate Kubernetes Manifests
        run: |
          echo "Validating Bankflow Kubernetes manifests..."
          kubectl apply -f k8s/secrets.yaml --dry-run=client -o yaml
          kubectl apply -f k8s/configmap.yaml --dry-run=client -o yaml
          kubectl apply -f k8s/account-service.yaml --dry-run=client -o yaml
          kubectl apply -f k8s/payment-service.yaml --dry-run=client -o yaml
          kubectl apply -f k8s/fraud-detection-service.yaml --dry-run=client -o yaml
          kubectl apply -f k8s/notification-service.yaml --dry-run=client -o yaml
          kubectl apply -f k8s/api-gateway.yaml --dry-run=client -o yaml
          kubectl apply -f k8s/ingress.yaml --dry-run=client -o yaml
          echo "All Kubernetes manifests successfully validated!"
