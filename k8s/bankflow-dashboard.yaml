apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankflow-dashboard
  namespace: bankflow
  labels:
    app: bankflow-dashboard
    part-of: bankflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bankflow-dashboard
  template:
    metadata:
      labels:
        app: bankflow-dashboard
    spec:
      containers:
        - name: bankflow-dashboard
          image: ghcr.io/sanju562586/bankflow-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: bankflow-dashboard
  namespace: bankflow
  labels:
    app: bankflow-dashboard
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: bankflow-dashboard
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bankflow-dashboard-hpa
  namespace: bankflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bankflow-dashboard
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
