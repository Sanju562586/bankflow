version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bankflow-postgres
    environment:
      POSTGRES_USER: bankflow
      POSTGRES_PASSWORD: bankflow_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Session & Rate Limiting Cache
  redis:
    image: redis:7-alpine
    container_name: bankflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Apache Kafka (KRaft mode - no zookeeper needed!)
  kafka:
    image: bashj79/kafka-kraft:latest
    container_name: bankflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # 4. Prometheus Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: bankflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # 5. Grafana Observability Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: bankflow-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  # 6. Jaeger Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: bankflow-jaeger
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  # 7. Account Service
  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: bankflow-account-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bankflow_accounts
      SPRING_DATASOURCE_USERNAME: bankflow
      SPRING_DATASOURCE_PASSWORD: bankflow_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # 8. Payment Service
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: bankflow-payment-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bankflow_payments
      SPRING_DATASOURCE_USERNAME: bankflow
      SPRING_DATASOURCE_PASSWORD: bankflow_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ACCOUNT_SERVICE_URL: http://account-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # 9. Fraud Detection Service
  fraud-detection-service:
    build:
      context: ./fraud-detection-service
      dockerfile: Dockerfile
    container_name: bankflow-fraud-service
    ports:
      - "8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      kafka:
        condition: service_healthy

  # 10. Notification Service
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: bankflow-notification-service
    ports:
      - "8084:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # 11. API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: bankflow-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      ACCOUNT_SERVICE_URL: http://account-service:8081
      PAYMENT_SERVICE_URL: http://payment-service:8082
      FRAUD_SERVICE_URL: http://fraud-detection-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      redis:
        condition: service_healthy

  # 12. Client Tier: Web Dashboard
  bankflow-dashboard:
    build:
      context: ./bankflow-dashboard
      dockerfile: Dockerfile
    container_name: bankflow-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
