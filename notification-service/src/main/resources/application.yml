server:
  port: 8084

spring:
  application:
    name: notification-service

  mail:
    host: ${SPRING_MAIL_HOST:smtp.mailtrap.io}
    port: ${SPRING_MAIL_PORT:2525}
    username: ${SPRING_MAIL_USERNAME:bankflow_alerts}
    password: ${SPRING_MAIL_PASSWORD:secret}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.bankflow.*"

bankflow:
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:AC_MOCK_TWILIO_SID}
    auth-token: ${TWILIO_AUTH_TOKEN:mock_auth_token}
    from-number: ${TWILIO_FROM_NUMBER:+14155238886}
    mock: true
  mail:
    mock: true
  kafka:
    topics:
      fraud-alerts: fraud-alerts
      txn-approved: txn-approved

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
